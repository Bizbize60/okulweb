<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderatör Ekibi — THKÜ</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans, 'Figtree', sans-serif); background: var(--night, #0A1322); color: var(--fg, #E9EDF3); min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 36px; flex-wrap: wrap; }
    .back { color: var(--fg-muted, #9AA6B8); text-decoration: none; font-size: .9rem; }
    .back:hover { color: var(--fg, #E9EDF3); }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    p.lead { color: var(--fg-muted, #9AA6B8); margin-top: 8px; max-width: 560px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; margin-top: 32px; }
    .card {
      background: var(--night-panel, #0F1C31);
      border: 1px solid var(--border, rgba(148,163,184,0.14));
      border-radius: var(--radius-lg, 14px);
      padding: 22px 18px 20px;
      text-align: center;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--border-hover, rgba(148,163,184,0.24)); }
    .photo {
      width: 96px; height: 96px; border-radius: 50%;
      object-fit: cover; margin: 0 auto 14px;
      border: 2px solid var(--thk-red, #C8102E);
      background: var(--surface, rgba(148,163,184,0.07));
      display: block;
    }
    .photo.placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: var(--fg-muted, #9AA6B8);
    }
    .name { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
    .unvan { font-size: .82rem; color: var(--sky, #7FA8C9); font-weight: 500; margin-bottom: 10px; min-height: 1em; }
    .email-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--sky, #7FA8C9); text-decoration: none; font-size: .82rem; font-weight: 500;
      word-break: break-all;
    }
    .email-link:hover { color: var(--fg, #E9EDF3); }
    .empty {
      text-align: center; color: var(--fg-muted, #9AA6B8); padding: 60px 20px;
      border: 1px dashed var(--border, rgba(148,163,184,0.14)); border-radius: var(--radius-lg, 14px); margin-top: 40px;
    }
  </style>
</head>
<body>
  <div id="navbarRoot"></div>

  <main class="container" style="padding-top: 36px; padding-bottom: 60px;">
    <div class="top">
      <div>
        <h1 style="margin-top:12px; font-size: 1.8rem; font-weight: 800; color: #fff;">Moderatör Ekibi</h1>
        <p class="lead" style="color: var(--fg-muted); margin-top: 6px;">Bu bağımsız öğrenci portalının moderatör ekibi. Destek ve geri bildirim için iletişime geçebilirsiniz.</p>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none; text-align:center; padding: 40px; color: var(--fg-muted);">Henüz moderatör eklenmemiş.</div>
  </main>

  <div id="footerRoot"></div>
  <script src="{{ url_for('static', filename='js/components.js') }}" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function(){
      var opts = { is_logged_in: {% if is_logged_in %}true{% else %}false{% endif %}, active: 'moderatorler' };
      if (window.THKU_UI && window.THKU_UI.Navbar) window.THKU_UI.Navbar.render('#navbarRoot', opts);
      if (window.THKU_UI && window.THKU_UI.Footer)  window.THKU_UI.Footer.render('#footerRoot');
    });

    const escapeHTML = str => {
      if (!str) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
      return String(str).replace(/[&<>'"]/g, t => map[t] || t);
    };
    const safeAssetUrl = (url) => {
      if (!url) return '';
      const u = String(url).trim();
      if (u.startsWith('/uploads/moderator/')) return u;
      return '';
    };

    async function load() {
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      try {
        const res = await fetch('/api/moderatorler');
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          empty.style.display = 'block';
          return;
        }
        grid.innerHTML = data.map(k => {
          const photo = safeAssetUrl(k.fotograf_url);
          return `
          <article class="card">
            ${photo
              ? `<img class="photo" src="${escapeHTML(photo)}" alt="${escapeHTML(k.ad)} ${escapeHTML(k.soyad)}">`
              : `<div class="photo placeholder">👤</div>`}
            <div class="name" style="font-weight:700;margin-bottom:4px;">${escapeHTML(k.ad)} ${escapeHTML(k.soyad)}</div>
            <div class="unvan" style="font-size:.82rem;color:var(--sky-blue);margin-bottom:10px;">${escapeHTML(k.unvan || '')}</div>
            ${k.email ? `<a class="email-link" href="mailto:${escapeHTML(k.email)}" style="color:var(--fg-muted);font-size:.82rem;">✉ ${escapeHTML(k.email)}</a>` : ''}
          </article>`;
        }).join('');
      } catch (e) {
        empty.style.display = 'block';
        empty.textContent = 'Liste yüklenirken bir hata oluştu.';
      }
    }
    load();
  </script>
</body>
</html>
