{# Ortak head etiketleri: Google Analytics (GA4) + Google AdSense. Tek yerden yönetilir. #}
<!-- thku-head-tags -->
{% if google_analytics_id %}
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id | e }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', {{ google_analytics_id | tojson }});
</script>
{% endif %}
{% if google_ads_client_id %}
<link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
<link rel="preconnect" href="https://googleads.g.doubleclick.net" crossorigin>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ google_ads_client_id | e }}"
  crossorigin="anonymous"></script>
{% endif %}
