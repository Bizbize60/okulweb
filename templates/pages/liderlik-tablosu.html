<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderlik Tablosu — THKÜ Portal</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- THKU UI Global -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
  <style>
    :root {
      --night: #0A1322;
      --night-deep: #060D18;
      --night-panel: #0F1C31;
      --thk-red: #C8102E;
      --thk-red-bright: #D7263D;
      --sky: #7FA8C9;
      --sky-wash: rgba(127,168,201,0.08);
      --fg: #E9EDF3;
      --fg-muted: #9AA6B8;
      --border: rgba(148,163,184,0.14);
      --border-hover: rgba(148,163,184,0.24);
      --warn: #D9A441;
      --warn-strong: #E8B84B;
      --warn-bg: rgba(217,164,65,0.08);
      --warn-border: rgba(217,164,65,0.28);
      --success: #34D399;
      --danger: #F87171;
      --surface: rgba(148,163,184,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans, 'Barlow', sans-serif); background: var(--night); color: var(--fg); padding: 90px 20px 60px; min-height: 100vh; }
    .wrap { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 2.3rem; letter-spacing: -.03em; margin-bottom: 10px; font-weight: 800; color: var(--fg); }
    .sub { color: var(--fg-muted); font-size: .95rem; margin-bottom: 28px; }
    .podium { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 16px; margin-bottom: 32px; align-items: end; }
    @media(max-width: 640px) { .podium { grid-template-columns: 1fr; } }
    .pod { background: var(--night-panel); border: 1px solid var(--border); border-radius: var(--radius-lg, 14px); padding: 24px 18px; text-align: center; position: relative; }
    .pod:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .pod-1 { order: 2; padding-top: 34px; border-color: var(--warn-border); }
    .pod-2 { order: 1; border-color: var(--border); }
    .pod-3 { order: 3; border-color: var(--border); }
    .rank-big { font-size: 2.6rem; margin-bottom: 8px; }
    .p-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; word-break: break-word; }
    .p-sev { font-size: .78rem; margin-bottom: 12px; opacity: .9; font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .p-puan { font-size: 1.5rem; font-weight: 800; color: var(--warn-strong); font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .p-sub { font-size: .75rem; color: var(--fg-muted); margin-top: 6px; font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .pod-1 .rank-big { color: var(--warn-strong); }
    .pod-2 .rank-big { color: var(--sky); }
    .pod-3 .rank-big { color: var(--warn); }
    .card { background: var(--night-panel); border: 1px solid var(--border); border-radius: var(--radius-lg, 14px); overflow: hidden; }
    .tab { width: 100%; border-collapse: collapse; }
    .tab th { text-align: left; padding: 14px 20px; font-size: .75rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .06em; background: var(--surface); border-bottom: 1px solid var(--border); font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .tab td { padding: 16px 20px; font-size: .9rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tab tr:last-child td { border-bottom: none; }
    .tab tr:hover td { background: var(--sky-wash); }
    .r-no { font-weight: 800; color: var(--fg-muted); width: 50px; font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .r-user { display: flex; align-items: center; gap: 14px; }
    .r-ava { width: 36px; height: 36px; border-radius: 50%; background: var(--thk-red); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .85rem; color: #fff; flex-shrink: 0; }
    .r-name { font-weight: 700; }
    .r-sev { font-size: .74rem; color: var(--fg-muted); margin-top: 2px; font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .seviye-Uye { color: var(--thk-red-bright); }
    .seviye-Bronz { color: #CD7F32; }
    .seviye-Gumus { color: #C0C0C0; }
    .seviye-Altın { color: var(--warn-strong); }
    .seviye-Elmas { color: var(--sky); }
    .r-puan { font-weight: 800; color: var(--warn-strong); font-family: var(--font-mono, 'Cascadia Mono', monospace); font-size: 1.05rem; }
    .r-davet { font-size: .8rem; color: var(--success); font-family: var(--font-mono, 'Cascadia Mono', monospace); font-weight: 600; }
    .me { background: rgba(200,16,46,0.08) !important; }
    .me td:first-child::before { content: '👉'; margin-right: 4px; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; color: var(--fg-muted); text-decoration: none; font-size: .85rem; font-weight: 600; }
    .back:hover { color: var(--thk-red); }
    .hafta-card { background: var(--night-panel); border: 1px solid var(--warn-border); padding: 22px; border-radius: var(--radius-lg, 14px); margin-bottom: 28px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .hafta-card .tac { font-size: 3.2rem; }
    .hafta-card .info { flex: 1; min-width: 200px; }
    .hafta-card h3 { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warn-strong); margin-bottom: 6px; font-family: var(--font-mono, 'Cascadia Mono', monospace); }
    .hafta-card .isim { font-size: 1.35rem; font-weight: 800; }
    .hafta-card .alt { font-size: .84rem; color: var(--fg-muted); margin-top: 4px; }
    .load { padding: 40px; text-align: center; color: var(--fg-muted); font-family: var(--font-mono, 'Cascadia Mono', monospace); }
  </style>
</head>
<body>
  <!-- REUSABLE NAVBAR -->
  <div id="navbarRoot"></div>
  <script src="{{ url_for('static', filename='js/components.js') }}" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function(){
      var opts = { is_logged_in: {% if is_logged_in %}true{%else%}false{%endif%}, active: 'liderlik' };
      if (window.THKU_UI && window.THKU_UI.Navbar) window.THKU_UI.Navbar.render('#navbarRoot', opts);
      if (window.THKU_UI && window.THKU_UI.Footer)  window.THKU_UI.Footer.render('#footerRoot');
    });
  </script>
<div class="wrap">
  <a href="/" class="back">← Anasayfaya dön</a>
  <h1>🏆 Liderlik Tablosu</h1>
  <p class="sub">En aktif ve en çok davet yapan öğrenci elçileri gör. 🚀 Hafta içi her gün güncellenir!</p>

  <div id="haftaElci" style="display:none;"></div>

  <div id="podium" class="podium"><div class="load">🥇 🥈 🥉 Yükleniyor...</div></div>

  <div class="card">
    <table class="tab">
      <thead>
        <tr><th>#</th><th>Öğrenci</th><th style="text-align:right;">Puan</th><th style="text-align:right;">Bu Hafta</th></tr>
      </thead>
      <tbody id="tabBody">
        <tr><td colspan="4" class="load">Veri yükleniyor...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const sevRenk = {'Üye':'seviye-Uye','Bronz':'seviye-Bronz','Gümüş':'seviye-Gumus','Altın':'seviye-Altın','Elmas':'seviye-Elmas'};
const sevIkon = {'Üye':'●','Bronz':'🥉','Gümüş':'🥈','Altın':'🥇','Elmas':'💎'};
let me = null;
async function yukle(){
  try{
    const [lr, hr] = await Promise.all([
      fetch('/api/ambassador/leaderboard',{credentials:'include'}),
      fetch('/api/ambassador/haftanin-elcisi',{credentials:'include'}).catch(()=>null)
    ]);
    const list = await lr.json();
    let h = null;
    if(hr && hr.ok){ try{ h = await hr.json(); }catch(e){} }
    try{
      const mr = await fetch('/api/user-info',{credentials:'include'});
      if(mr.ok){ const md = await mr.json(); me = md.email || null; }
    }catch(e){}
    // Haftanın elçisi
    if(h && h.elci){
      const hdiv = document.getElementById('haftaElci');
      hdiv.style.display='flex';
      hdiv.className = 'hafta-card';
      hdiv.innerHTML = `<div class="tac">👑</div>
        <div class="info">
          <h3>🏆 Bu Haftanın Elçisi</h3>
          <div class="isim">${h.elci.name||'Bilinmiyor'}</div>
          <div class="alt">${h.elci.seviye_adi||'Üye'} · ${(h.elci.hafta_davet||0)} davet · ${(h.elci.ambassador_points||0).toLocaleString('tr')} toplam puan</div>
        </div>`;
    }
    // Podyum (ilk 3)
    const top3 = list.slice(0,3);
    const p = document.getElementById('podium'); p.innerHTML='';
    [1,2,0].forEach(idx=>{
      if(top3[idx]){
        const div = document.createElement('div');
        div.className = 'pod pod-'+(idx+1);
        const ik = sevIkon[top3[idx].seviye_adi]||'●';
        div.innerHTML = `<div class="rank-big">${idx===1?'🥇':idx===2?'🥈':'🥉'}</div>
          <div class="p-name">${top3[idx].name||'?'} ${top3[idx].is_ambassador?'<span title="Resmi Elçi" style="color:var(--gold);">⭐</span>':''}</div>
          <div class="p-sev seviye-${top3[idx].seviye_adi||'Üye'}">${ik} ${top3[idx].seviye_adi||'Üye'}</div>
          <div class="p-puan">${(top3[idx].ambassador_points||0).toLocaleString('tr')}</div>
          <div class="p-sub">${(top3[idx].hafta_davet||0)} yeni davet bu hafta</div>`;
        p.appendChild(div);
      }
    });
    // Tablo
    const tb = document.getElementById('tabBody'); tb.innerHTML='';
    list.forEach((u,i)=>{
      const rnk = i+1;
      const sevA = u.seviye_adi || 'Üye';
      const meMi = me && u.email && u.email.toLowerCase() === me.toLowerCase();
      const tr = document.createElement('tr'); if(meMi) tr.className='me';
      const ikon = sevIkon[sevA]||'●';
      tr.innerHTML = `<td class="r-no">${rnk}</td>
        <td><div class="r-user">
          <div class="r-ava">${(u.name||'?').trim().charAt(0).toUpperCase()}</div>
          <div><div class="r-name">${u.name||'?'} ${u.is_ambassador?'<span title="Resmi Elçi" style="color:var(--gold);">⭐</span>':''}</div>
          <div class="r-sev"><span class="${sevRenk[sevA]||''}">${ikon} ${sevA}</span></div></div>
        </div></td>
        <td style="text-align:right;"><span class="r-puan">${(u.ambassador_points||0).toLocaleString('tr')}</span></td>
        <td style="text-align:right;"><span class="r-davet">+${u.hafta_davet||0} davet</span></td>`;
      tb.appendChild(tr);
    });
    if(!list.length){ tb.innerHTML='<tr><td colspan="4" class="load">Henüz liste boş. İlk elçi sen ol! 🚀</td></tr>'; }
  }catch(e){ console.error(e); }
}
yukle();
</script>

  <!-- REUSABLE FOOTER -->
  <div id="footerRoot"></div>
</body>
</html>
