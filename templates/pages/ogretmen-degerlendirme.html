<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğretmen Değerlendir — THKÜ</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
  <style>
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--fg);
    }
    .page-sub {
      color: var(--fg-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .cockpit-form-card {
      background: var(--night-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 40px;
    }

    .form-group {
      margin-bottom: 24px;
    }
    .form-group label, .rating-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--fg);
    }

    .cockpit-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--night-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cockpit-input:focus {
      border-color: var(--thk-red);
    }

    .rating-group {
      margin-bottom: 26px;
      background: var(--sky-wash);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }

    .stars {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .star {
      font-size: 32px;
      color: var(--border);
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), color 0.15s;
    }
    .star:hover, .star.active {
      color: var(--warn);
      transform: scale(1.15);
    }

    .tags-group {
      margin-bottom: 25px;
    }

    .tags-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .tag-checkbox { display: none; }
    .tag-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      background: var(--night-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--fg-muted);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    .tag-label:hover {
      border-color: var(--border-accent);
      color: var(--fg);
    }
    .tag-checkbox:checked + .tag-label {
      background: rgba(200, 16, 46, 0.12);
      border-color: var(--thk-red);
      color: var(--thk-red-bright);
    }

    .grade-group {
      margin-bottom: 30px;
    }

    .grades-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .grade-radio { display: none; }
    .grade-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      background: var(--night-deep);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--fg-muted);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .grade-radio:checked + .grade-label {
      background: var(--thk-red);
      color: #FFFFFF;
      border-color: var(--thk-red);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--thk-red);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .submit-btn:hover {
      background: var(--thk-red-bright);
      transform: translateY(-2px);
    }

    .alert {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .alert-success {
      background: rgba(52, 211, 153, 0.1);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .alert-error {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }
  </style>
</head>

<body>
  <!-- REUSABLE NAVBAR -->
  <div id="navbarRoot"></div>
  <script src="{{ url_for('static', filename='js/components.js') }}" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function(){
      var opts = { is_logged_in: 'auto', active: 'ogretmenler' };
      if (window.THKU_UI && window.THKU_UI.Navbar) window.THKU_UI.Navbar.render('#navbarRoot', opts);
      if (window.THKU_UI && window.THKU_UI.Footer)  window.THKU_UI.Footer.render('#footerRoot');
    });
  </script>

  <div class="container" style="max-width: 740px; padding-top: 30px;">
    <div class="page-head reveal-on-scroll">
      <div>
        <div class="hud-tag hud-tag-cyan" style="margin-bottom:8px;">INSTRUCTOR FEEDBACK PROTOCOL</div>
        <h1 class="page-title">Öğretmen Değerlendirmesi</h1>
        <p class="page-sub">Ders deneyimlerinizi anonim olarak paylaşarak dönem arkadaşlarına rehberlik edin.</p>
      </div>
      <div>
        <a href="/ogretmen-listesi" class="btn btn-outline">← Öğretmenlere Dön</a>
      </div>
    </div>

    <div id="alert-container"></div>

    <div class="cockpit-form-card reveal-on-scroll">
      <form id="degerlendirme-form">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label for="ad">Öğretim Görevlisi Adı <span style="color:var(--warn)">*</span></label>
            <input type="text" id="ad" name="ad" class="cockpit-input" placeholder="Örn: Leyla" required>
          </div>
          <div class="form-group">
            <label for="soyad">Soyadı <span style="color:var(--warn)">*</span></label>
            <input type="text" id="soyad" name="soyad" class="cockpit-input" placeholder="Örn: Atmaca" required>
          </div>
        </div>

        <div class="rating-group">
          <label class="rating-label">📚 Ders Anlatma Kalitesi <span style="color:var(--warn)">*</span></label>
          <div class="stars" id="ders-stars">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <input type="hidden" id="ders_anlatma" name="ders_anlatma" required>
        </div>

        <div class="rating-group">
          <label class="rating-label">📝 Sınav Zorluğu <span style="color:var(--warn)">*</span></label>
          <div class="stars" id="sinav-stars">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
          <input type="hidden" id="sinav_zorlugu" name="sinav_zorlugu" required>
        </div>

        <div class="tags-group">
          <label>Öğretim Görevlisi Özellikleri (Seçenekli)</label>
          <div class="tags-container">
            <input type="checkbox" id="slayttan_isler" name="slayttan_isler" class="tag-checkbox">
            <label for="slayttan_isler" class="tag-label">📊 Slayttan İşler</label>
            <input type="checkbox" id="yoklama_alir" name="yoklama_alir" class="tag-checkbox">
            <label for="yoklama_alir" class="tag-label">✓ Yoklama Alır</label>
            <input type="checkbox" id="kitap_onemli" name="kitap_onemli" class="tag-checkbox">
            <label for="kitap_onemli" class="tag-label">📚 Kitap Önemli</label>
            <input type="checkbox" id="kanaat_notu" name="kanaat_notu" class="tag-checkbox">
            <label for="kanaat_notu" class="tag-label">💭 Kanaat Notu Kullanır</label>
            <input type="checkbox" id="projeye_onem" name="projeye_onem" class="tag-checkbox">
            <label for="projeye_onem" class="tag-label">🎯 Projeye Önem Verir</label>
          </div>
        </div>


            <div class="grade-group">
                <label>Aldığınız Harf Notu (seçenekli)</label>
                <div class="grade-container">
                    <input type="radio" id="grade_AA" name="alinan_harf_notu" value="AA" class="grade-radio">
                    <label for="grade_AA" class="grade-label">AA</label>

                    <input type="radio" id="grade_BA" name="alinan_harf_notu" value="BA" class="grade-radio">
                    <label for="grade_BA" class="grade-label">BA</label>

                    <input type="radio" id="grade_BB" name="alinan_harf_notu" value="BB" class="grade-radio">
                    <label for="grade_BB" class="grade-label">BB</label>

                    <input type="radio" id="grade_CB" name="alinan_harf_notu" value="CB" class="grade-radio">
                    <label for="grade_CB" class="grade-label">CB</label>

                    <input type="radio" id="grade_CC" name="alinan_harf_notu" value="CC" class="grade-radio">
                    <label for="grade_CC" class="grade-label">CC</label>

                    <input type="radio" id="grade_DC" name="alinan_harf_notu" value="DC" class="grade-radio">
                    <label for="grade_DC" class="grade-label">DC</label>

                    <input type="radio" id="grade_DD" name="alinan_harf_notu" value="DD" class="grade-radio">
                    <label for="grade_DD" class="grade-label">DD</label>

                    <input type="radio" id="grade_FD" name="alinan_harf_notu" value="FD" class="grade-radio">
                    <label for="grade_FD" class="grade-label">FD</label>

                    <input type="radio" id="grade_FF" name="alinan_harf_notu" value="FF" class="grade-radio">
                    <label for="grade_FF" class="grade-label">FF</label>
                </div>
        <div style="margin-top: 24px;">
          <button type="submit" class="submit-btn">Değerlendirmeyi Gönder</button>
        </div>
      </form>
    </div>
  </div>

  <!-- REUSABLE FOOTER -->
  <div id="footerRoot"></div>

  <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Yıldız derecelendirme
            function setupStars(containerId, inputId) {
                const container = document.getElementById(containerId);
                const stars = container.querySelectorAll('.star');
                const input = document.getElementById(inputId);

                stars.forEach((star, index) => {
                    star.addEventListener('click', () => {
                        const value = star.getAttribute('data-value');
                        input.value = value;

                        stars.forEach((s, i) => {
                            if (i < value) {
                                s.classList.add('active');
                            } else {
                                s.classList.remove('active');
                            }
                        });
                    });
                });
            }

            setupStars('ders-stars', 'ders_anlatma');
            setupStars('sinav-stars', 'sinav_zorlugu');

            // Form gönderimi
            document.getElementById('degerlendirme-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                const formData = new FormData(e.target);
                const data = {};

                for (let [key, value] of formData.entries()) {
                    if (key.includes('_')) {
                        data[key] = value;
                    }
                }

                // Checkboxları ekle
                data.slayttan_isler = document.getElementById('slayttan_isler').checked;
                data.yoklama_alir = document.getElementById('yoklama_alir').checked;
                data.kitap_onemli = document.getElementById('kitap_onemli').checked;
                data.kanaat_notu = document.getElementById('kanaat_notu').checked;
                data.projeye_onem = document.getElementById('projeye_onem').checked;

                // Text inputları ekle
                data.ad = document.getElementById('ad').value;
                data.soyad = document.getElementById('soyad').value;

                try {
                    const response = await fetch('/api/degerlendirme-ekle', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showAlert('Değerlendirmeniz başarıyla gönderildi!', 'success');
                        setTimeout(() => {
                            window.location.href = '/ogretmen-listesi';
                        }, 1500);
                    } else {
                        showAlert(result.message || 'Bir hata oluştu', 'error');
                    }
                } catch (error) {
                    showAlert('Bir hata oluştu. Lütfen tekrar deneyin.', 'error');
                }
            });

            function showAlert(message, type) {
                const container = document.getElementById('alert-container');
                const alert = document.createElement('div');
                alert.className = `alert alert-${type}`;
                alert.textContent = message;
                container.appendChild(alert);

                setTimeout(() => {
                    alert.remove();
                }, 3000);
            }
        });
    </script>
</body>

</html>
