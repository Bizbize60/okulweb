<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampüs Pazarı & Ekipman Takası — THKÜ</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
  <style>
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--fg);
    }
    .page-sub {
      color: var(--fg-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .market-filter-stream {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 2px 18px;
      margin-bottom: 28px;
      scrollbar-width: thin;
    }
    .m-filter-btn {
      padding: 10px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--fg-muted);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .m-filter-btn:hover {
      border-color: var(--border-hover);
      color: var(--fg);
      background: var(--surface-hover);
    }
    .m-filter-btn.active {
      background: var(--thk-red);
      color: var(--fg);
      border-color: transparent;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    .market-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .market-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .market-media {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      background: var(--night-deep);
    }
    .market-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .market-card:hover .market-img {
      transform: scale(1.04);
    }
    .market-price-tag {
      position: absolute;
      right: 14px;
      bottom: 14px;
      background: var(--night);
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 6px 14px;
      border-radius: var(--radius-full);
    }

    .market-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .market-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .market-category {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--sky);
      background: var(--sky-wash);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }
    .market-date {
      color: var(--fg-muted);
      font-size: 0.75rem;
      font-family: var(--font-mono);
    }

    .market-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--fg);
      margin: 0 0 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .market-desc {
      margin: 0 0 20px;
      color: var(--fg-muted);
      font-size: 0.88rem;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-whatsapp-cockpit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: auto;
      padding: 12px 16px;
      background: var(--success);
      color: var(--night);
      text-decoration: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-whatsapp-cockpit:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <!-- REUSABLE NAVBAR -->
  <div id="navbarRoot"></div>
  <script src="{{ url_for('static', filename='js/components.js') }}" defer></script>
  <script>
    window.addEventListener('DOMContentLoaded', function(){
      var opts = { is_logged_in: 'auto', active: 'pazar' };
      if (window.THKU_UI && window.THKU_UI.Navbar) window.THKU_UI.Navbar.render('#navbarRoot', opts);
      if (window.THKU_UI && window.THKU_UI.Footer)  window.THKU_UI.Footer.render('#footerRoot');
    });
  </script>

  <div class="container" style="padding-top: 30px;">
    <div class="page-head reveal-on-scroll">
      <div>
        <div class="hud-tag hud-tag-cyan" style="margin-bottom:8px;">CAMPUS EXCHANGE & HARDWARE MARKET</div>
        <h1 class="page-title">Kampüs Bit Pazarı</h1>
        <p class="page-sub">Öğrenciden öğrenciye doğrudan havacılık ekipmanı, ders kitapları ve yurt eşyaları alışverişi.</p>
      </div>
      <div style="display: flex; gap: 12px;">
        <a href="/ilan-ekle" class="btn btn-primary">+ İlan Yayınla</a>
        <a href="/" class="btn btn-outline">← Ana Sayfa</a>
      </div>
    </div>

    <!-- Filtreler -->
    <div class="market-filter-stream reveal-on-scroll">
      <button class="m-filter-btn active" onclick="filterItems('Tümü')">Tümü</button>
      <button class="m-filter-btn" onclick="filterItems('Havacılık Ekipmanları')">✈️ Havacılık Ekipmanı</button>
      <button class="m-filter-btn" onclick="filterItems('Ders Materyalleri')">📚 Ders Kitabı & Not</button>
      <button class="m-filter-btn" onclick="filterItems('Yurt Eşyaları')">🛏️ Yurt Eşyaları</button>
      <button class="m-filter-btn" onclick="filterItems('Diğer')">📦 Diğer</button>
    </div>

    <!-- İlan Grid -->
    <div id="pazarGrid" class="market-grid reveal-on-scroll">
      <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--fg-muted);">
        <div class="hud-loader-radar" style="margin: 0 auto 16px; width: 60px; height: 60px;">
          <img src="{{ url_for('static', filename='img/logo.png') }}" onerror="this.onerror=null;this.src='/static/img/kedi.ico'" alt="THKÜ">
        </div>
        <p>İlanlar yükleniyor...</p>
      </div>
    </div>
  </div>

  <!-- REUSABLE FOOTER -->
  <div id="footerRoot"></div>

  <script>
    const grid = document.getElementById('pazarGrid');
    const filterBtns = document.querySelectorAll('.m-filter-btn');
    let allItems = [];

    const escapeHTML = str => {
      if (!str) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
      return String(str).replace(/[&<>'"]/g, tag => map[tag] || tag);
    };

    const renderItems = (items) => {
      if (!items?.length) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--fg-muted); background:var(--bg-surface); border:1px dashed var(--border); border-radius:var(--radius-lg);">Bu kategoride henüz aktif bir ilan bulunmamaktadır.</div>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const safeImg = escapeHTML(item.resim || item.resim_url || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80');
        const safeTitle = escapeHTML(item.baslik);
        const safePrice = escapeHTML(item.fiyat);
        const safeCategory = escapeHTML(item.kategori || 'Diğer');
        const safeDate = escapeHTML(item.tarih || '');
        const safeDesc = escapeHTML(item.aciklama || '');
        const safePhone = escapeHTML((item.iletisim || '').replace(/\D/g, '').slice(-10));

        return `
          <article class="market-card">
            <div class="market-media">
              <img src="${safeImg}" alt="${safeTitle}" class="market-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80'">
              <div class="market-price-tag">${safePrice} ₺</div>
            </div>
            <div class="market-body">
              <div class="market-topline">
                <span class="market-category">${safeCategory}</span>
                <span class="market-date">${safeDate}</span>
              </div>
              <h3 class="market-title" title="${safeTitle}">${safeTitle}</h3>
              <p class="market-desc">${safeDesc}</p>
              <a href="https://wa.me/90${safePhone}" target="_blank" class="btn-whatsapp-cockpit" rel="noopener noreferrer">
                <span>💬 WhatsApp İletişim</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    };

    const filterItems = (category) => {
      filterBtns.forEach(btn => {
        const btnText = btn.textContent.trim();
        btn.classList.toggle('active', btnText.includes(category) || (category === 'Tümü' && btnText === 'Tümü'));
      });

      const filtered = category === 'Tümü' ? allItems : allItems.filter(item => item.kategori === category);
      renderItems(filtered);
    };

    const loadItems = async () => {
      try {
        const res = await fetch('/api/pazar');
        if (!res.ok) throw new Error('API Hatası');
        allItems = await res.json();
        renderItems(allItems);
      } catch (err) {
        console.error("İlanlar yüklenemedi:", err);
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--danger);">İlanlar yüklenirken bir sorun oluştu. Lütfen sayfayı yenileyiniz.</div>';
      }
    };

    document.addEventListener('DOMContentLoaded', loadItems);
  </script>
</body>

</html>
